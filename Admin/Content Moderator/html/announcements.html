<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#503413" />
  <title>HapagPamana · Announcements & Events</title>

  <link rel="icon" type="image/png" href="../../assets/HapagPamana.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:wght@500;600;700&family=Spectral:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../css/global.css" />
  <style>
    .ann-card {
      background: var(--paper-2);
      border: 1px solid var(--hair);
      border-radius: var(--r);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .ann-card:hover {
      border-color: var(--gold);
      box-shadow: var(--shadow-sm);
    }
    .ann-card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .ann-title {
      font-family: var(--display);
      font-size: 20px;
      font-weight: 700;
      color: var(--ink);
      margin: 0 0 4px 0;
      line-height: 1.2;
    }
    .ann-meta-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 6px;
    }
    .ann-meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      color: var(--ink-soft);
      background: var(--vellum);
      padding: 3px 9px;
      border-radius: 999px;
    }
    .ann-meta-pill .ic {
      font-size: 12px;
      color: var(--gold-deep);
    }
    .ann-thumb-wrap {
      width: 100%;
      height: 150px;
      border-radius: var(--r);
      overflow: hidden;
      background: var(--paper-3);
      border: 1px solid var(--hair-soft);
      position: relative;
    }
    .ann-thumb-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: var(--vellum);
    }
    .ann-thumb-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-deep);
      background: linear-gradient(135deg, var(--paper-2), var(--vellum));
    }
    .ann-thumb-fallback .ic {
      font-size: 32px;
    }
    .ann-desc {
      font-size: 14px;
      color: var(--ink-soft);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin: 0;
    }
    .ann-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--hair-soft);
      padding-top: 10px;
      margin-top: auto;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-family: var(--engraved);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 600;
    }
    .status-badge.published {
      background: rgba(92, 122, 51, 0.15);
      color: var(--ok);
      border: 1px solid rgba(92, 122, 51, 0.3);
    }
    .status-badge.draft {
      background: rgba(146, 122, 78, 0.15);
      color: var(--ink-faint);
      border: 1px solid rgba(146, 122, 78, 0.3);
    }
    .status-badge.archived {
      background: rgba(152, 105, 27, 0.15);
      color: var(--warn);
      border: 1px solid rgba(152, 105, 27, 0.3);
    }
    .status-badge.promo-badge {
      background: rgba(184, 134, 11, 0.18);
      color: #92580a;
      border: 1px solid rgba(184, 134, 11, 0.4);
      font-weight: 700;
    }
    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 768px) {
      .form-grid-2 {
        grid-template-columns: 1fr;
      }
    }
    .image-dropzone {
      border: 2px dashed var(--gold-hair);
      border-radius: var(--r);
      padding: 20px;
      text-align: center;
      background: var(--paper-3);
      cursor: pointer;
      position: relative;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .image-dropzone:hover, .image-dropzone.dragover {
      border-color: var(--gold);
      background: var(--paper-2);
    }
    .image-preview-box {
      margin-top: 10px;
      position: relative;
      border-radius: var(--r);
      overflow: hidden;
      max-height: 180px;
      border: 1px solid var(--hair);
      background: var(--vellum);
    }
    .image-preview-box img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      display: block;
    }
    .image-preview-box .btn-remove {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(42, 26, 8, 0.85);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .discount-config-box {
      background: var(--paper-2);
      border: 1px solid var(--gold-hair);
      border-radius: var(--r);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .discount-chip-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
      max-height: 140px;
      overflow-y: auto;
      padding: 2px;
    }
    .discount-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      background: var(--vellum);
      border: 1px solid var(--hair);
      color: var(--ink-soft);
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }
    .discount-chip:hover {
      border-color: var(--gold);
      color: var(--ink);
    }
    .discount-chip.active {
      background: var(--gold-deep);
      border-color: var(--gold-deep);
      color: #fff;
      font-weight: 600;
    }
    .discount-chip input {
      display: none;
    }
  </style>
</head>
<body>
  <template id="tpl-view">
    <div class="seg" id="statusTabs" role="tablist" aria-label="Announcement status"></div>
    <div class="toolbar" id="annToolbar" style="margin-bottom:16px;"></div>
    <div class="prod-grid" id="annRows"></div>
  </template>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="../../firebase-config.js"></script>
  <script src="../js/config.js"></script>
  <script src="../../assets/hp-guard.js"></script>
  <script src="../../assets/hp-core.js"></script>
  <script src="../../assets/hp-shell.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/announcements.js"></script>
</body>
</html>
