<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#503311" />
  <title>HapagPamana · About, Legal & FAQ</title>

  <link rel="icon" type="image/png" href="../../assets/HapagPamana-nav.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:wght@500;600;700&family=Spectral:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../css/global.css" />
</head>
<body>
  <template id="tpl-view">
    <div class="bento about-bento">
      <!-- Top banner / Actions & Section Tabs -->
      <section class="bento-tile b-12">
        <div class="bento-head" style="flex-wrap: wrap; gap: 12px;">
          <div class="label-grp">
            <span class="stat-ic"><span class="ic" data-icon="book"></span></span>
            <span class="bento-label">About, Policies & Help Content</span>
          </div>
          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button class="btn btn-ghost" id="aboutReset"><span class="ic" data-icon="undo"></span>Restore Defaults</button>
            <button class="btn btn-primary" id="aboutSave"><span class="ic" data-icon="upload"></span>Save Changes</button>
          </div>
        </div>
        <p class="bento-desc" style="margin-bottom: 14px;">Manage the About narrative, Terms of Service clauses, Privacy Policy clauses, and Help &amp; FAQ items displayed live in the customer app.</p>
        <div class="seg" id="contentSectionTabs" role="tablist" style="display:inline-flex; flex-wrap:wrap; gap:6px;">
          <button type="button" class="active" data-section-tab="about">About Page</button>
          <button type="button" data-section-tab="tos">Terms of Service</button>
          <button type="button" data-section-tab="privacy">Privacy Policy</button>
          <button type="button" data-section-tab="faq">Help &amp; FAQ</button>
        </div>
      </section>

      <!-- ════════════════════════════ TAB: ABOUT PAGE ════════════════════════════ -->
      <!-- 1. Hero Mantra & Story -->
      <section class="bento-tile b-6" data-section-pane="about">
        <div class="bento-head">
          <div class="label-grp">
            <span class="stat-ic"><span class="ic" data-icon="star"></span></span>
            <span class="bento-label">Hero &amp; Mantra</span>
          </div>
        </div>
        <div class="field">
          <label>Header Eyebrow</label>
          <input class="control" id="mantraEyebrow" placeholder="SINCE 2016 · THE FILL AT HOME STORY" />
        </div>
        <div class="field">
          <label>Hero Mantra Quote</label>
          <textarea class="control" id="mantraQuote" rows="3" placeholder="Be patient — your small business will grow enough to pay your bills."></textarea>
        </div>
        <div class="field">
          <label>Mantra Footer Label</label>
          <input class="control" id="mantraLabel" placeholder="OUR MANTRA FROM DAY ONE" />
        </div>
      </section>

      <!-- 2. Story / Where it Began -->
      <section class="bento-tile b-6" data-section-pane="about">
        <div class="bento-head">
          <div class="label-grp">
            <span class="stat-ic"><span class="ic" data-icon="ledger"></span></span>
            <span class="bento-label">Our Story</span>
          </div>
        </div>
        <div class="form-grid-2">
          <div class="field">
            <label>Section Eyebrow</label>
            <input class="control" id="storyEyebrow" placeholder="WHERE WE BEGAN" />
          </div>
          <div class="field">
            <label>Section Title</label>
            <input class="control" id="storyTitle" placeholder="Our Story" />
          </div>
        </div>
        <div class="field">
          <label>Story Body Narrative</label>
          <textarea class="control" id="storyBody" rows="4" placeholder="We tried to open a small Fill at Home canteen..."></textarea>
        </div>
        <div class="field">
          <label>Highlighted Pull Quote</label>
          <input class="control" id="storyPullquote" placeholder="Little did we know that with a little effort..." />
        </div>
      </section>

      <!-- 3. Milestones Timeline -->
      <section class="bento-tile b-12" data-section-pane="about">
        <div class="bento-head">
          <div class="label-grp">
            <span class="stat-ic"><span class="ic" data-icon="calendar"></span></span>
            <span class="bento-label">Milestone Timeline</span>
          </div>
          <button class="btn btn-primary btn-sm" id="milestoneAdd"><span class="ic" data-icon="plus"></span>Add Milestone</button>
        </div>
        <div class="form-grid-2" style="margin-bottom: 16px;">
          <div class="field">
            <label>Timeline Eyebrow</label>
            <input class="control" id="milestonesEyebrow" placeholder="THE FIRST YEAR" />
          </div>
          <div class="field">
            <label>Timeline Title</label>
            <input class="control" id="milestonesTitle" placeholder="From Day 1 to Day 365" />
          </div>
        </div>
        <div id="milestoneList"></div>
      </section>

      <!-- 4. Offerings -->
      <section class="bento-tile b-12" data-section-pane="about">
        <div class="bento-head">
          <div class="label-grp">
            <span class="stat-ic"><span class="ic" data-icon="dish"></span></span>
            <span class="bento-label">What We Offer</span>
          </div>
          <button class="btn btn-primary btn-sm" id="offerAdd"><span class="ic" data-icon="plus"></span>Add Offering</button>
        </div>
        <div class="form-grid-2">
          <div class="field">
            <label>Offerings Eyebrow</label>
            <input class="control" id="offeringsEyebrow" placeholder="AT YOUR TABLE" />
          </div>
          <div class="field">
            <label>Offerings Title</label>
            <input class="control" id="offeringsTitle" placeholder="What We Offer" />
          </div>
        </div>
        <div class="field">
          <label>Offerings Subtitle</label>
          <input class="control" id="offeringsSubtitle" placeholder="A seat at our table for every occasion..." />
        </div>
        <div id="offerList"></div>
      </section>

      <!-- 5. Contact Details -->
      <section class="bento-tile b-6" data-section-pane="about">
        <div class="bento-head">
          <div class="label-grp">
            <span class="stat-ic"><span class="ic" data-icon="pin"></span></span>
            <span class="bento-label">Contact &amp; Location</span>
          </div>
        </div>
        <div class="field">
          <label>Location / Address</label>
          <input class="control" id="contactAddress" placeholder="The Kitchen · Metro Manila, Philippines" />
        </div>
        <div class="field">
          <label>Google Maps Query Term</label>
          <input class="control" id="contactMapQuery" placeholder="Fill at Home Catering, Metro Manila" />
        </div>
        <div class="field">
          <label>Kitchen Hours</label>
          <input class="control" id="contactHours" placeholder="Monday – Sunday · 8:00 AM – 8:00 PM" />
        </div>
        <div class="form-grid-2">
          <div class="field">
            <label>Phone Number</label>
            <input class="control" id="contactPhone" placeholder="0917 123 4567" />
          </div>
          <div class="field">
            <label>Email Address</label>
            <input class="control" id="contactEmail" placeholder="hello@fillathome.ph" />
          </div>
        </div>
      </section>

      <!-- 6. Social Channels -->
      <section class="bento-tile b-6" data-section-pane="about">
        <div class="bento-head">
          <div class="label-grp">
            <span class="stat-ic"><span class="ic" data-icon="eye"></span></span>
            <span class="bento-label">Social Channels</span>
          </div>
        </div>
        <div class="field">
          <label>Facebook URL</label>
          <input class="control" id="socialFacebook" placeholder="https://www.facebook.com/fillathome" />
        </div>
        <div class="field">
          <label>Instagram URL</label>
          <input class="control" id="socialInstagram" placeholder="https://www.instagram.com/fillathome" />
        </div>
        <div class="field">
          <label>TikTok URL</label>
          <input class="control" id="socialTiktok" placeholder="https://www.tiktok.com/@fillathome" />
        </div>
      </section>

      <!-- 7. Family Closing Quote & Footer -->
      <section class="bento-tile b-12" data-section-pane="about">
        <div class="bento-head">
          <div class="label-grp">
            <span class="stat-ic"><span class="ic" data-icon="heart"></span></span>
            <span class="bento-label">Family Closing Quote &amp; Footer Sign-off</span>
          </div>
        </div>
        <div class="field">
          <label>Closing Quote Text</label>
          <textarea class="control" id="quoteText" rows="3" placeholder="So if you have a dream — no matter how difficult..."></textarea>
        </div>
        <div class="form-grid-2">
          <div class="field">
            <label>Sign-off Author / Signature</label>
            <input class="control" id="quoteAuthor" placeholder="— THE FILL AT HOME FAMILY" />
          </div>
          <div class="field">
            <label>Footer Brand Sign-off</label>
            <input class="control" id="footerText" placeholder="FILL AT HOME · SINCE 2016" />
          </div>
        </div>
      </section>

      <!-- ════════════════════════════ TAB: TERMS OF SERVICE ════════════════════════════ -->
      <section class="bento-tile b-12" data-section-pane="tos" hidden>
        <div class="bento-head" style="flex-wrap:wrap; gap:10px;">
          <div class="label-grp">
            <span class="stat-ic"><span class="ic" data-icon="ledger"></span></span>
            <span class="bento-label">Terms of Service</span>
          </div>
          <button class="btn btn-primary btn-sm" id="tosClauseAdd"><span class="ic" data-icon="plus"></span>Add Numbered Clause</button>
        </div>
        <p class="bento-desc">Each clause is automatically numbered (01, 02, 03…) in the customer app with a prominent badge indicator so members always see which section they are reading.</p>
        <div class="form-grid-2" style="margin-bottom: 16px;">
          <div class="field">
            <label>Last Updated Date</label>
            <input class="control" id="tosLastUpdated" placeholder="4 August 2026" />
          </div>
          <div class="field">
            <label>Opening Subtitle (Lede)</label>
            <input class="control" id="tosLede" placeholder="The understanding between you and our kitchen when you order through this app." />
          </div>
        </div>
        <div id="tosClauseList"></div>
      </section>

      <!-- ════════════════════════════ TAB: PRIVACY POLICY ════════════════════════════ -->
      <section class="bento-tile b-12" data-section-pane="privacy" hidden>
        <div class="bento-head" style="flex-wrap:wrap; gap:10px;">
          <div class="label-grp">
            <span class="stat-ic"><span class="ic" data-icon="shield"></span></span>
            <span class="bento-label">Privacy Policy</span>
          </div>
          <button class="btn btn-primary btn-sm" id="ppClauseAdd"><span class="ic" data-icon="plus"></span>Add Numbered Clause</button>
        </div>
        <p class="bento-desc">Manage the numbered Privacy Policy clauses, paragraphs, and bullet lists shown in the app.</p>
        <div class="form-grid-2" style="margin-bottom: 16px;">
          <div class="field">
            <label>Last Updated Date</label>
            <input class="control" id="ppLastUpdated" placeholder="4 August 2026" />
          </div>
          <div class="field">
            <label>Opening Subtitle (Lede)</label>
            <input class="control" id="ppLede" placeholder="What we keep about you, who can see it, and how to have it changed or removed." />
          </div>
        </div>
        <div id="ppClauseList"></div>
      </section>

      <!-- ════════════════════════════ TAB: HELP & FAQ ════════════════════════════ -->
      <section class="bento-tile b-12" data-section-pane="faq" hidden>
        <div class="bento-head" style="flex-wrap:wrap; gap:10px;">
          <div class="label-grp">
            <span class="stat-ic"><span class="ic" data-icon="book"></span></span>
            <span class="bento-label">Help &amp; FAQ</span>
          </div>
          <button class="btn btn-primary btn-sm" id="faqGroupAdd"><span class="ic" data-icon="plus"></span>Add FAQ Category</button>
        </div>
        <p class="bento-desc">Organize frequently asked questions by category. Questions are numbered automatically within each category in the app.</p>
        <div id="faqGroupList"></div>
      </section>
    </div>
  </template>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="../../firebase-config.js"></script>
  <script src="../js/config.js"></script>
  <script src="../../assets/hp-guard.js"></script>
  <script src="../../assets/hp-core.js"></script>
  <script src="../../assets/hp-shell.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/about.js"></script>
</body>
</html>
