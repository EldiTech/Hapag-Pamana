<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#503413" />
  <title>HapagPamana · Petty Cash</title>

  <link rel="icon" type="image/png" href="../../assets/HapagPamana.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:wght@500;600;700&family=Spectral:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../../Content%20Moderator/css/global.css" />
  <link rel="stylesheet" href="../../Purchasing/css/purchasing.css" />
  <link rel="stylesheet" href="../css/finance.css" />
</head>
<body>
  <template id="tpl-view">
    <!-- The ingredient float: what is in the box, and where every peso went.
         Releasing a requisition takes cash out; liquidating a run brings the
         change back. Nothing moves without a ledger entry. -->
    <section class="panel pc-hero" id="cashHero"></section>

    <div class="stat-grid" id="cashStats"></div>

    <div class="toolbar" id="cashChips"></div>

    <section class="panel">
      <div class="table-wrap">
        <table class="data">
          <thead>
            <tr>
              <th>When</th>
              <th>Movement</th>
              <th>Reason</th>
              <th>Slip / client</th>
              <th>Balance after</th>
              <th>By</th>
            </tr>
          </thead>
          <tbody id="cashRows"></tbody>
        </table>
      </div>
    </section>
  </template>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="../../firebase-config.js"></script>
  <script src="../js/config.js"></script>
  <script src="../../assets/hp-guard.js"></script>
  <script src="../../assets/hp-core.js"></script>
  <script src="../../assets/hp-shell.js"></script>
  <script src="../../assets/hp-procurement.js"></script>
  <script src="../../assets/hp-cash.js"></script>
  <script src="../js/finance-common.js"></script>
  <script src="../js/cash.js"></script>
</body>
</html>
