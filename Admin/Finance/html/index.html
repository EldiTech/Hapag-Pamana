<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#503413" />
  <title>HapagPamana · Finance</title>

  <link rel="icon" type="image/png" href="../../assets/HapagPamana.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:wght@500;600;700&family=Spectral:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <!-- The Finance dashboard shares the Heirloom Editorial design system with
       the other staff portals — one stylesheet, four portals. -->
  <link rel="stylesheet" href="../../Content%20Moderator/css/global.css" />
  <link rel="stylesheet" href="../css/finance.css" />
</head>
<body>
  <template id="tpl-view">
    <!-- The costing board — every confirmed order whose ingredients the Master
         Chef has planned. A stat ledger up top, then the board: costing-status
         tabs, type chips, search, and the costing sheet, where the kitchen's
         list is read, the other costs are added, the money is checked and the
         requisition slip is released. -->
    <div class="stat-grid" id="financeStats"></div>

    <div class="seg" id="costSeg" role="tablist" aria-label="Costing status"></div>
    <div class="toolbar" id="typeChips"></div>

    <section class="panel">
      <div class="table-wrap">
        <table class="data">
          <thead>
            <tr>
              <th>Event</th>
              <th>Client</th>
              <th>Type</th>
              <th>Ingredients</th>
              <th>The money</th>
              <th>Costing</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="orderRows"></tbody>
        </table>
      </div>
    </section>
  </template>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="../../firebase-config.js"></script>
  <script src="../js/config.js"></script>
  <script src="../../assets/hp-guard.js"></script>
  <script src="../../assets/hp-core.js"></script>
  <script src="../../assets/hp-shell.js"></script>
  <script src="../js/finance-common.js"></script>
  <script src="../../assets/hp-cash.js"></script>
  <script src="../js/costing.js"></script>
</body>
</html>
