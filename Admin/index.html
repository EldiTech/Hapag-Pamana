<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#503413" />
  <title>HapagPamana · Admin Sign In</title>
  <meta name="description" content="Staff portal for HapagPamana Catering Services." />

  <link rel="icon" type="image/png" href="assets/HapagPamana.png" />

  <!-- Brand type: Cormorant Garamond (headings) · Montserrat (UI) · Cinzel (engraved) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="assets/styles.css" />
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("hp_admin_theme");
        var isDark = stored ? stored === "dark" : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <!-- Floating theme toggle -->
  <button class="theme-toggle-login" id="themeToggle" type="button" aria-label="Toggle theme" title="Toggle Light / Dark mode">
    <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
    </svg>
    <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>

  <main class="layout">
    <!-- ─────────── Brand showcase ─────────── -->
    <aside class="brand-panel" aria-hidden="true">
      <div class="weave"></div>
      <div class="brand-inner">
        <div class="medallion">
          <img src="assets/HapagPamana.png" alt="" class="medallion-logo" />
        </div>
        <h1 class="brand-title">HapagPamana</h1>
        <p class="brand-sub">Catering Services</p>
        <span class="engraved engraved--light">
          <i class="rule"></i><i class="dot"></i>
          Lutong Pinoy, Pamanang Sarap
          <i class="dot"></i><i class="rule"></i>
        </span>
      </div>
      <p class="brand-foot">Admin &amp; Staff Management Portal</p>
    </aside>

    <!-- ─────────── Sign-in form ─────────── -->
    <section class="form-panel">
      <div class="form-card">
        <!-- Compact logo for mobile, where the brand panel collapses -->
        <img src="assets/HapagPamana.png" alt="HapagPamana" class="mobile-logo" />

        <div class="seal" aria-hidden="true">
          <div class="seal-ring">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2.5 4 6v5.5c0 4.5 3.2 8 8 9.5 4.8-1.5 8-5 8-9.5V6l-8-3.5Z" />
              <path d="M9 12.2l2 2 4-4.4" />
            </svg>
          </div>
        </div>

        <span class="engraved engraved--dark">
          <i class="rule"></i><i class="dot"></i>
          Staff Portal
          <i class="dot"></i><i class="rule"></i>
        </span>

        <h2 class="title">Admin Sign In</h2>
        <p class="subtitle">Pamamahala ng hapag — para sa tauhan.</p>

        <form id="loginForm" class="secure-panel" novalidate>
          <div class="panel-head">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="7" cy="12" r="3.2" />
              <path d="M10.2 12H20" />
              <path d="M17 12v3" />
              <path d="M20 12v3.5" />
            </svg>
            <span>SECURE ACCESS</span>
          </div>

          <div class="field">
            <label for="identifier">Admin ID or Email</label>
            <div class="input-wrap">
              <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="16" rx="2" />
                <path d="M3 7l9 6 9-6" />
              </svg>
              <input id="identifier" name="identifier" type="text" autocomplete="username"
                placeholder="admin@hapagpamana.ph" required />
            </div>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="11" width="14" height="9" rx="2" />
                <path d="M8 11V8a4 4 0 0 1 8 0v3" />
              </svg>
              <input id="password" name="password" type="password" autocomplete="current-password"
                placeholder="••••••••" required />
              <button type="button" class="reveal" id="reveal" aria-label="Show password" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                  stroke-linejoin="round">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
            <p class="capslock-hint" id="capsHint" role="status" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M12 4 5 11h4v4h6v-4h4z" />
                <path d="M9 19h6" />
              </svg>
              Caps Lock is on
            </p>
          </div>

          <div class="row">
            <label class="remember">
              <input type="checkbox" id="remember" name="remember" />
              <span class="box" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"
                  stroke-linejoin="round">
                  <path d="M5 12.5l4 4 10-10" />
                </svg>
              </span>
              Remember device
            </label>
            <a href="#" class="link-gold" id="forgot">Forgot password?</a>
          </div>

          <p class="form-error" id="formError" role="alert" hidden></p>

          <button type="submit" class="btn-primary" id="submitBtn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="5" y="11" width="14" height="9" rx="2" />
              <path d="M8 11V8a4 4 0 0 1 7.5-2" />
            </svg>
            <span class="label">SIGN IN</span>
          </button>
        </form>

        <p class="authorized">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="1.8" />
            <path d="M8.2 8.2a5.4 5.4 0 0 0 0 7.6" />
            <path d="M15.8 8.2a5.4 5.4 0 0 1 0 7.6" />
          </svg>
          Authorized personnel only · access is monitored
        </p>
      </div>
    </section>
  </main>

  <!-- Sign-in success curtain: fades over the form, draws a gold check seal, and
       masks the hand-off to the dashboard (which shows its own brown auth-gate).
       Revealed by app.js via body.is-success once access is confirmed. -->
  <div class="welcome-veil" id="welcomeVeil" aria-hidden="true">
    <div class="welcome-inner">
      <div class="welcome-seal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
          stroke-linejoin="round">
          <path class="check" d="M5 12.5l4.5 4.5L19 7.5" />
        </svg>
      </div>
      <h2 class="welcome-text" id="welcomeText">Welcome back</h2>
      <p class="welcome-sub"><span class="welcome-spin"></span>Entering the kitchen…</p>
    </div>
  </div>

  <!-- Firebase (compat build — exposes the global `firebase`) + project config -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="assets/app.js"></script>
</body>

</html>
