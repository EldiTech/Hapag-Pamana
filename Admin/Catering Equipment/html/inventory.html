<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#503413" />
  <title>HapagPamana · Equipment Inventory</title>

  <link rel="icon" type="image/png" href="../../assets/HapagPamana.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:wght@500;600;700&family=Spectral:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../../Content%20Moderator/css/global.css" />
  <link rel="stylesheet" href="../../Purchasing/css/purchasing.css" />
  <link rel="stylesheet" href="../css/equipment.css" />
</head>
<body>
  <template id="tpl-view">
    <!-- Every piece of equipment this desk tracks, grouped into categories,
         each with its own variants and on-hand counts. Nothing here moves
         without a logged reason — see equipment-common.js. -->
    <div class="stat-grid" id="eqStats"></div>

    <div class="seg" id="eqChips"></div>

    <section class="panel">
      <div class="table-wrap">
        <table class="data">
          <thead>
            <tr>
              <th>Item</th>
              <th>Category</th>
              <th>Variants</th>
              <th>State</th>
              <th>Last updated</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="eqRows"></tbody>
        </table>
      </div>
    </section>
  </template>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="../../firebase-config.js"></script>
  <script src="../js/config.js"></script>
  <script src="../../assets/hp-guard.js"></script>
  <script src="../../assets/hp-core.js"></script>
  <script src="../../assets/hp-shell.js"></script>
  <script src="../js/equipment-common.js"></script>
  <script src="../js/inventory.js"></script>
</body>
</html>
