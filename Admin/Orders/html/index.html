<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#503413" />
  <title>HapagPamana · Orders</title>

  <link rel="icon" type="image/png" href="../../assets/HapagPamana.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:wght@500;600;700&family=Spectral:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <!-- The Orders dashboard shares the Heirloom Editorial design system with
       the Content Moderator — one stylesheet, two staff portals. -->
  <link rel="stylesheet" href="../../Content%20Moderator/css/global.css" />
  <link rel="stylesheet" href="../css/orders.css" />
</head>
<body>
  <template id="tpl-view">
    <!-- Order management — every booking the app files into `bookings`:
         the catering wizard's requests and the food-pack quotations. A stat
         ledger up top, then the order register: status tabs, type chips,
         search, the booking sheet, and the pending→confirmed→completed
         workflow. -->
    <div class="stat-grid" id="orderStats"></div>

    <div class="seg" id="statusSeg" role="tablist" aria-label="Order status"></div>
    <div class="toolbar" id="typeChips"></div>

    <section class="panel">
      <div class="table-wrap">
        <table class="data">
          <thead>
            <tr>
              <th>Client</th>
              <th>Type</th>
              <th>Function</th>
              <th>Event date</th>
              <th>Pax</th>
              <th>Received</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="orderRows"></tbody>
        </table>
      </div>
    </section>
  </template>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="../../firebase-config.js"></script>
  <script src="../js/config.js"></script>
  <script src="../../assets/hp-guard.js"></script>
  <script src="../../assets/hp-core.js"></script>
  <script src="../../assets/hp-shell.js"></script>
  <script src="../js/orders.js"></script>
</body>
</html>
