<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="hapag_pamana">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>hapag_pamana</title>
  <link rel="manifest" href="manifest.json">

  <!-- The address picker's embedded map needs the Maps JS API loaded before
       google_maps_flutter's web plugin runs, or it throws
       "Cannot read properties of undefined (reading 'maps')".
       This file is the committed template -- tool/inject_maps_key.ps1 reads
       GOOGLE_MAPS_API_KEY out of .env (same key as build.gradle.kts and
       AppDelegate.swift use for Android/iOS) and writes web/index.html from
       this template with the key substituted. web/index.html itself is
       gitignored, so the real key never lands in source control. Run that
       script before `flutter run -d chrome` or `flutter build web`. -->
  <script src="https://maps.googleapis.com/maps/api/js?key=$GOOGLE_MAPS_API_KEY" async></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
